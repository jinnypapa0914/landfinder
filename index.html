<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>표준지 지번 확인 관리</title>

  <!-- =====================================================
       Kakao Maps API
       ===================================================== -->
  <script
    type="text/javascript"
    src="//dapi.kakao.com/v2/maps/sdk.js?appkey=f4f9103a2544f3ae3c961de63f4275ce&libraries=services">
  </script>

  <!-- =====================================================
       SheetJS
       ===================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


  <style>

    /* =====================================================
       기본
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100vh;
      position: relative;
    }


    /* =====================================================
       왼쪽 패널
       ===================================================== */

    #sidebar {
      width: 390px;
      height: 100%;

      background: #fff;

      border-right: 1px solid #ddd;

      display: flex;
      flex-direction: column;

      z-index: 100;

      transition: left 0.3s ease;
    }

    #titleArea {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 16px 18px 12px;

      border-bottom: 1px solid #eee;
    }

    #title {
      font-size: 21px;
      font-weight: bold;
    }

    #btnMenuOpen,
    #btnMenuClose {
      display: none;
    }


    /* =====================================================
       엑셀 영역
       ===================================================== */

    #excelArea {
      padding: 12px 15px;

      background: #f8f9fa;

      border-bottom: 1px solid #ddd;
    }

    #excelAreaTitle {
      font-size: 14px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    #excelFile {
      width: 100%;
      font-size: 13px;
    }

    #excelButton {
      width: 100%;
      height: 42px;

      margin-top: 8px;

      border: none;
      border-radius: 6px;

      background: #198754;

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    #excelButton:hover {
      background: #157347;
    }

    #progressArea {
      display: none;
      margin-top: 10px;
    }

    #progressText {
      font-size: 12px;
      color: #555;

      margin-bottom: 5px;
    }

    #progressBarOuter {
      width: 100%;
      height: 10px;

      background: #ddd;

      border-radius: 5px;

      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;

      background: #198754;

      transition: width 0.2s;
    }


    /* =====================================================
       주소 검색
       ===================================================== */

    #searchArea {
      padding: 12px 15px;

      border-bottom: 1px solid #eee;
    }

    #addressInput {
      width: 100%;
      height: 42px;

      padding: 0 11px;

      font-size: 14px;

      border: 1px solid #ccc;
      border-radius: 6px;

      outline: none;
    }

    #searchButton {
      width: 100%;
      height: 42px;

      margin-top: 7px;

      border: none;
      border-radius: 6px;

      background: #3388ff;

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }


    /* =====================================================
       통계
       ===================================================== */

    #statistics {
      padding: 9px 15px;

      font-size: 12px;
      line-height: 1.7;

      background: #fff;

      border-bottom: 1px solid #eee;
    }

    #statistics strong {
      color: #333;
    }


    /* =====================================================
       상태 표시
       ===================================================== */

    #statusInfo {
      display: flex;
      gap: 5px;

      padding: 8px 15px;

      border-bottom: 1px solid #eee;
    }

    .statusBox {
      flex: 1;

      padding: 5px 2px;

      text-align: center;

      border-radius: 5px;

      color: white;

      font-size: 11px;
      font-weight: bold;
    }

    .statusUnknown {
      background: #1b365d;
    }

    .statusDone {
      background: #28a745;
    }

    .statusHold {
      background: #dc3545;
    }


    /* =====================================================
       목록
       ===================================================== */

    #list {
      flex: 1;

      overflow-y: auto;

      padding: 8px;
    }

    .listItem {
      display: flex;
      align-items: center;

      padding: 9px 7px;

      margin-bottom: 5px;

      border: 1px solid #ddd;
      border-radius: 7px;

      background: white;

      cursor: pointer;
    }

    .listStatus {
      width: 17px;
      height: 17px;

      min-width: 17px;

      border-radius: 50%;

      margin-right: 8px;
    }

    .listAddress {
      flex: 1;

      min-width: 0;

      font-size: 13px;

      line-height: 1.4;
    }

    .managementNo,
    .statusText {
      color: #777;

      font-size: 11px;
    }

    .deleteButton {
      width: 29px;
      height: 29px;

      border: none;
      border-radius: 5px;

      background: #eee;

      color: #555;

      cursor: pointer;
    }


    /* =====================================================
       지도
       ===================================================== */

    #map {
      flex: 1;

      height: 100%;

      position: relative;
    }


    /* =====================================================
       지도 버튼
       ===================================================== */

    .mapControlPanel {
      position: absolute;

      top: 15px;
      right: 15px;

      z-index: 5;

      background: white;

      border-radius: 6px;

      box-shadow:
        0 2px 6px rgba(0,0,0,0.3);

      display: flex;

      overflow: hidden;

      border: 1px solid #ccc;
    }

    .mapBtn {
      padding: 8px 12px;

      font-size: 12px;
      font-weight: bold;

      background: white;

      border: none;

      cursor: pointer;

      color: #333;

      border-right: 1px solid #ddd;
    }

    .mapBtn:last-child {
      border-right: none;
    }

    .mapBtn.active {
      background: #3388ff;

      color: white;
    }

    .mapBtn.tracking-active {
      background: #dc3545;

      color: white;
    }


    /* =====================================================
       ★★★ 핵심 : 원형 마커 ★★★

       1줄 = 관리번호
       2줄 = 리
       3줄 = 지번

       원 내부 완전 투명
       ===================================================== */

    .customMarkerCircle {

      min-width: 52px;
      min-height: 52px;

      padding: 6px 8px;

      border-radius: 50%;

      /*
       ★ 원 내부 투명
      */
      background: transparent !important;
      background-color: transparent !important;

      /*
       ★ 배경 이미지도 제거
      */
      background-image: none !important;

      /*
       ★ 그림자 제거
      */
      box-shadow: none !important;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      user-select: none;

      white-space: nowrap;

      cursor: pointer;

      /*
       ★ 필터 제거
      */
      filter: none !important;
    }


    /* =====================================================
       상태별 원 테두리
       ===================================================== */

    .marker-box-0 {

      border: 2.5px solid #1b365d !important;

      color: #1b365d !important;

      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;

      box-shadow: none !important;
    }

    .marker-box-1 {

      border: 2.5px solid #1e7e34 !important;

      color: #1e7e34 !important;

      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;

      box-shadow: none !important;
    }

    .marker-box-2 {

      border: 2.5px solid #bd2130 !important;

      color: #bd2130 !important;

      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;

      box-shadow: none !important;
    }


    /* =====================================================
       ★ 마커 글자

       기존 흰색 외곽선 완전 제거

       ★ text-shadow 없음
       ★ -webkit-text-stroke 없음
       ★ background 없음
       ===================================================== */

    .marker-text-line {

      line-height: 1.05;

      font-weight: bold;

      background: transparent !important;

      background-color: transparent !important;

      background-image: none !important;

      /*
       ★★★ 흰색 외곽선 제거 ★★★
      */
      text-shadow: none !important;

      /*
       ★★★ 문자 테두리 제거 ★★★
      */
      -webkit-text-stroke: 0 transparent !important;

      text-decoration: none !important;

      /*
       ★ 필터 제거
      */
      filter: none !important;

      /*
       ★ 부모의 글자색을 강제로 사용
      */
      color: inherit !important;
    }


    /* =====================================================
       1줄 : 관리번호
       ===================================================== */

    .line-no {

      font-size: 12px;

      color: inherit !important;
    }


    /* =====================================================
       2줄 : 리
       관리번호의 절반
       12px → 6px
       ===================================================== */

    .line-village {

      font-size: 6px;

      color: inherit !important;
    }


    /* =====================================================
       3줄 : 지번
       관리번호의 절반
       12px → 6px
       ===================================================== */

    .line-lot {

      font-size: 6px;

      margin-top: 1px;

      opacity: 1;

      color: inherit !important;
    }


    /* =====================================================
       내 위치
       ===================================================== */

    @keyframes pulse-ring-red {

      0% {
        box-shadow:
          0 0 0 0
          rgba(220, 53, 69, 0.7);
      }

      70% {
        box-shadow:
          0 0 0 15px
          rgba(220, 53, 69, 0);
      }

      100% {
        box-shadow:
          0 0 0 0
          rgba(220, 53, 69, 0);
      }
    }

    .currentLocMarker {

      width: 18px;
      height: 18px;

      background-color: #dc3545;

      border: 3px solid #ffffff;

      border-radius: 50%;

      box-shadow:
        0 0 5px rgba(0,0,0,0.5);

      position: relative;

      z-index: 20;

      animation:
        pulse-ring-red 2s infinite;
    }


    /* =====================================================
       모바일
       ===================================================== */

    @media (max-width: 700px) {

      #sidebar {

        position: absolute;

        top: 0;
        left: -320px;

        width: 320px;

        box-shadow:
          2px 0 10px rgba(0,0,0,0.3);
      }

      #sidebar.open {
        left: 0;
      }

      #title {
        font-size: 18px;
      }

      #btnMenuOpen {

        display: block;

        position: absolute;

        top: 15px;
        left: 15px;

        z-index: 10;

        padding: 8px 12px;

        background: white;

        border: 1px solid #ccc;

        border-radius: 6px;

        box-shadow:
          0 2px 6px rgba(0,0,0,0.3);

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        color: #333;
      }

      #btnMenuClose {

        display: block;

        background: none;

        border: none;

        font-size: 22px;

        color: #555;

        font-weight: bold;

        cursor: pointer;

        padding: 0 5px;
      }

        top: 60px;

      }

      .mapBtn {

      }
    }

  </style>

</head>


<body>

<div id="app">


  <!-- =====================================================
       왼쪽 패널
       ===================================================== -->

  <div id="sidebar" class="open">


    <div id="titleArea">

      <div id="title">
        표준지 지번 확인 관리
      </div>

      <button
        id="btnMenuClose"
        onclick="toggleMenu()">

        ✕

      </button>

    </div>


    <!-- ===================================================
         엑셀
         =================================================== -->

    <div id="excelArea">

      <div id="excelAreaTitle">
        📂 표준지 엑셀 일괄등록
      </div>

      <input
        type="file"
        id="excelFile">

      <button
        id="excelButton">

        엑셀 주소 불러오기

      </button>


      <div id="progressArea">

        <div id="progressText">
          준비 중...
        </div>

        <div id="progressBarOuter">

          <div id="progressBar"></div>

        </div>

      </div>

    </div>


    <!-- ===================================================
         주소 검색
         =================================================== -->

    <div id="searchArea">

      <input
        type="text"
        id="addressInput"
        placeholder="예: 청도군 이서면 고철리 6">

      <button
        id="searchButton">

        주소 검색

      </button>

    </div>


    <!-- ===================================================
         통계
         =================================================== -->

    <div id="statistics">

      <div>
        전체:
        <strong id="totalCount">0</strong>건
      </div>

      <div>
        표시:
        <strong id="successCount">0</strong>건
      </div>

      <div>
        검색실패:
        <strong id="failCount">0</strong>건
      </div>

      <div>
        확인완료:
        <strong id="doneCount">0</strong>건
      </div>

    </div>


    <!-- ===================================================
         상태
         =================================================== -->

    <div id="statusInfo">

      <div class="statusBox statusUnknown">
        미확인
      </div>

      <div class="statusBox statusDone">
        확인완료
      </div>

      <div class="statusBox statusHold">
        보류
      </div>

    </div>


    <div id="list"></div>

  </div>


  <!-- =====================================================
       지도
       ===================================================== -->

  <div id="map">


    <button
      id="btnMenuOpen"
      onclick="toggleMenu()">

      ☰ 메뉴

    </button>


    <div class="mapControlPanel">


      <button
        type="button"
        id="btnCurrentLoc"
        class="mapBtn"
        onclick="toggleCurrentLocation()">

        내 위치(OFF)

      </button>


      <button
        type="button"
        id="btnRoadmap"
        class="mapBtn"
        onclick="setMapType('roadmap')">

        일반지도

      </button>


      <button
        type="button"
        id="btnSkyview"
        class="mapBtn active"
        onclick="setMapType('skyview')">

        위성지도

      </button>


      <button
        type="button"
        id="btnDistrict"
        class="mapBtn active"
        onclick="toggleDistrict()">

        지적편집도(ON)

      </button>


    </div>

  </div>

</div>


<script>


/* =========================================================
   메뉴
   ========================================================= */

function toggleMenu() {

  const sidebar =
    document.getElementById('sidebar');

  sidebar.classList.toggle('open');
}


/* =========================================================
   지도 생성
   ========================================================= */

const mapContainer =
  document.getElementById('map');

const mapOption = {

  center:
    new kakao.maps.LatLng(
      35.6628,
      128.6694
    ),

  level: 3
};

const map =
  new kakao.maps.Map(
    mapContainer,
    mapOption
  );


/* =========================================================
   위성지도
   ========================================================= */

map.setMapTypeId(
  kakao.maps.MapTypeId.SKYVIEW
);


/* =========================================================
   지적편집도
   ========================================================= */

map.addOverlayMapTypeId(
  kakao.maps.MapTypeId.USE_DISTRICT
);

let isDistrictOn = true;


/* =========================================================
   지도 종류 변경
   ========================================================= */

function setMapType(type) {

  const btnRoadmap =
    document.getElementById(
      'btnRoadmap'
    );

  const btnSkyview =
    document.getElementById(
      'btnSkyview'
    );


  if (type === 'roadmap') {

    map.setMapTypeId(
      kakao.maps.MapTypeId.ROADMAP
    );

    btnRoadmap.classList.add(
      'active'
    );

    btnSkyview.classList.remove(
      'active'
    );

  } else {

    map.setMapTypeId(
      kakao.maps.MapTypeId.SKYVIEW
    );

    btnSkyview.classList.add(
      'active'
    );

    btnRoadmap.classList.remove(
      'active'
    );
  }
}


/* =========================================================
   지적편집도 ON/OFF
   ========================================================= */

function toggleDistrict() {

  const btnDistrict =
    document.getElementById(
      'btnDistrict'
    );


  if (isDistrictOn) {

    map.removeOverlayMapTypeId(
      kakao.maps.MapTypeId.USE_DISTRICT
    );

    isDistrictOn = false;

    btnDistrict.textContent =
      '지적편집도(OFF)';

    btnDistrict.classList.remove(
      'active'
    );

  } else {

    map.addOverlayMapTypeId(
      kakao.maps.MapTypeId.USE_DISTRICT
    );

    isDistrictOn = true;

    btnDistrict.textContent =
      '지적편집도(ON)';

    btnDistrict.classList.add(
      'active'
    );
  }
}


/* =========================================================
   확대/축소
   ========================================================= */

const zoomControl =
  new kakao.maps.ZoomControl();

map.addControl(
  zoomControl,
  kakao.maps.ControlPosition.RIGHT
);


/* =========================================================
   주소 검색
   ========================================================= */

const geocoder =
  new kakao.maps.services.Geocoder();


/* =========================================================
   데이터
   ========================================================= */

let locations = [];

let failedAddresses = [];

let excelTotalCount = 0;


/* =========================================================
   이벤트
   ========================================================= */

document
  .getElementById('searchButton')
  .addEventListener(
    'click',
    searchManualAddress
  );


document
  .getElementById('addressInput')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        searchManualAddress();

      }

    }
  );


document
  .getElementById('excelButton')
  .addEventListener(
    'click',
    loadExcel
  );


/* =========================================================
   내 위치
   ========================================================= */

let currentLocationOverlay = null;

let locationWatchId = null;

let isTracking = false;


function toggleCurrentLocation() {

  const btnLoc =
    document.getElementById(
      'btnCurrentLoc'
    );


  /* -------------------------------------------------------
     OFF
     ------------------------------------------------------- */

  if (isTracking) {

    if (
      navigator.geolocation &&
      locationWatchId !== null
    ) {

      navigator.geolocation.clearWatch(
        locationWatchId
      );

      locationWatchId = null;
    }


    isTracking = false;


    btnLoc.classList.remove(
      'tracking-active'
    );


    btnLoc.textContent =
      '내 위치(OFF)';


    if (currentLocationOverlay) {

      currentLocationOverlay.setMap(
        null
      );

      currentLocationOverlay = null;
    }


  } else {


    /* -----------------------------------------------------
       ON
       ----------------------------------------------------- */

    if (navigator.geolocation) {

      isTracking = true;


      btnLoc.classList.add(
        'tracking-active'
      );


      btnLoc.textContent =
        '내 위치(ON)';


      locationWatchId =
        navigator.geolocation.watchPosition(

          function(position) {

            const lat =
              position.coords.latitude;

            const lon =
              position.coords.longitude;


            const locPosition =
              new kakao.maps.LatLng(
                lat,
                lon
              );


            if (
              !currentLocationOverlay
            ) {

              const content =
                document.createElement(
                  'div'
                );


              content.className =
                'currentLocMarker';


              content.title =
                '실시간 내 위치';


              currentLocationOverlay =
                new kakao.maps.CustomOverlay({

                  map: map,

                  position:
                    locPosition,

                  content:
                    content,

                  xAnchor: 0.5,

                  yAnchor: 0.5,

                  zIndex: 20

                });


              map.setCenter(
                locPosition
              );


              map.setLevel(3);


            } else {

              currentLocationOverlay
                .setPosition(
                  locPosition
                );
            }

          },


          function(error) {

            alert(
              '위치 정보를 가져올 수 없습니다. 권한을 확인해 주세요.'
            );


            if (isTracking) {

              toggleCurrentLocation();

            }

          },


          {
            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 10000
          }

        );

    } else {

      alert(
        '이 브라우저에서는 위치 정보가 지원되지 않습니다.'
      );
    }
  }
}


/* =========================================================
   수동 주소 검색
   ========================================================= */

function searchManualAddress() {

  const address =
    document
      .getElementById('addressInput')
      .value
      .trim();


  if (!address) {

    alert(
      '주소를 입력해주세요.'
    );

    return;
  }


  searchOneAddress(
    address,
    '',
    ''
  );
}


/* =========================================================
   ★ 리 이름 추출
   =========================================================

   예:

   이서면 철곡리
   → 철곡리

   경상북도 청도군 이서면 철곡리
   → 철곡리

   철곡리
   → 철곡리

   이서면 양원리
   → 양원리
   ========================================================= */

function extractRiName(text) {

  if (!text) {

    return '';
  }


  const parts =
    String(text)
      .trim()
      .split(/\s+/);


  /*
   ★ 뒤에서부터 검사해서
     가장 마지막 '○○리'를 찾음
  */

  for (
    let i = parts.length - 1;
    i >= 0;
    i--
  ) {

    const part =
      parts[i].trim();


    if (
      part.endsWith('리')
    ) {

      return part;
    }
  }


  /*
   '리'가 없으면
   원래 값 반환
  */

  return String(text).trim();
}


/* =========================================================
   LocalStorage 저장
   ========================================================= */

function saveToLocalStorage() {

  const dataToSave =
    locations.map(
      l => ({

        id:
          l.id,

        address:
          l.address,

        lat:
          l.lat,

        lng:
          l.lng,

        managementNo:
          l.managementNo,

        village:
          l.village,

        lotNumber:
          l.lotNumber,

        status:
          l.status
      })
    );


  localStorage.setItem(
    'standard_locations_v4',
    JSON.stringify(
      dataToSave
    )
  );


  localStorage.setItem(
    'standard_totalCount_v4',
    excelTotalCount
  );
}


/* =========================================================
   LocalStorage 불러오기
   ========================================================= */

function loadFromLocalStorage() {

  const savedData =
    localStorage.getItem(
      'standard_locations_v4'
    );


  const savedTotal =
    localStorage.getItem(
      'standard_totalCount_v4'
    );


  if (savedData) {

    try {

      const parsed =
        JSON.parse(
          savedData
        );


      excelTotalCount =
        savedTotal
          ? Number(savedTotal)
          : parsed.length;


      parsed.forEach(
        item => {

          const location = {

            id:
              item.id,

            address:
              item.address,

            lat:
              item.lat,

            lng:
              item.lng,

            managementNo:
              item.managementNo || '',

            /*
             ★ 기존에 저장된 값도
                다시 리 이름만 추출
            */
            village:
              extractRiName(
                item.village || ''
              ),

            lotNumber:
              item.lotNumber || '',

            status:
              item.status || 0,

            marker:
              null
          };


          locations.push(
            location
          );


          createMarker(
            location
          );
        }
      );


      renderList();

      updateStatistics();


      if (
        locations.length > 0
      ) {

        fitAllMarkers();
      }


    } catch(e) {

      console.error(e);

    }
  }
}


/* =========================================================
   엑셀 불러오기
   ========================================================= */

function loadExcel() {

  const fileInput =
    document.getElementById(
      'excelFile'
    );


  if (
    !fileInput.files ||
    fileInput.files.length === 0
  ) {

    alert(
      '먼저 엑셀 파일을 선택해주세요.'
    );

    return;
  }


  const file =
    fileInput.files[0];


  const fileName =
    file.name.toLowerCase();


  if (
    !fileName.endsWith('.xlsx') &&
    !fileName.endsWith('.xls')
  ) {

    alert(
      '엑셀 파일(.xlsx, .xls)만 업로드할 수 있습니다.'
    );

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    async function(event) {

      try {

        const data =
          new Uint8Array(
            event.target.result
          );


        const workbook =
          XLSX.read(
            data,
            {
              type: 'array'
            }
          );


        const rows =
          XLSX.utils.sheet_to_json(
            workbook.Sheets[
              workbook.SheetNames[0]
            ],
            {
              header: 1,
              defval: ''
            }
          );


        if (
          !rows ||
          rows.length === 0
        ) {

          return;
        }


        let startIndex = 0;


        /*
         첫 번째 행이 숫자가 아니면
         제목행으로 판단
        */

        if (
          isNaN(
            Number(
              String(
                rows[0][0] || ''
              ).trim()
            )
          )
        ) {

          startIndex = 1;
        }


        const excelRows = [];


        /* -------------------------------------------------
           엑셀 구조

           1열 = 관리번호
           2열 = 주소 또는 리
           3열 = 지번
           ------------------------------------------------- */

        for (
          let i = startIndex;
          i < rows.length;
          i++
        ) {

          if (
            !rows[i] ||
            rows[i].length < 3
          ) {

            continue;
          }


          const managementNo =
            String(
              rows[i][0] || ''
            ).trim();


          /*
           ★ 여기에서
              이서면 철곡리
              → 철곡리
           */

          const village =
            extractRiName(
              String(
                rows[i][1] || ''
              ).trim()
            );


          const lotNumber =
            String(
              rows[i][2] || ''
            ).trim();


          if (
            village === '' &&
            lotNumber === ''
          ) {

            continue;
          }


          excelRows.push({

            managementNo:

              managementNo,

            village:

              village,

            lotNumber:

              lotNumber,

            address:

              makeFullAddress(
                village,
                lotNumber
              )
          });
        }


        excelTotalCount =
          excelRows.length;


        /* -------------------------------------------------
           기존 데이터가 있는 경우
           ------------------------------------------------- */

        if (
          locations.length > 0
        ) {

          if (
            !confirm(

              '현재 지도에 ' +
              locations.length +
              '개의 지번이 있습니다.\n\n' +
              '기존 데이터를 지우고 새 엑셀 파일을 불러오시겠습니까?'

            )
          ) {

            return;
          }


          clearAllLocations();
        }


        failedAddresses = [];


        showProgress();


        /* -------------------------------------------------
           주소 검색
           ------------------------------------------------- */

        for (
          let i = 0;
          i < excelRows.length;
          i++
        ) {

          updateProgress(

            i,

            excelRows.length,

            excelRows[i].address
          );


          await searchOneAddressAsync(

            excelRows[i].address,

            excelRows[i].managementNo,

            excelRows[i].village,

            excelRows[i].lotNumber

          );


          await sleep(250);
        }


        updateProgress(

          excelRows.length,

          excelRows.length,

          '완료'
        );


        saveToLocalStorage();


        fitAllMarkers();


        updateStatistics();


        setTimeout(
          hideProgress,
          1500
        );


        if (
          window.innerWidth <= 700
        ) {

          toggleMenu();
        }


        alert(

          failedAddresses.length > 0

            ?

            `검색 성공: ${locations.length}건\n검색 실패: ${failedAddresses.length}건`

            :

            '모두 표시되었습니다.'

        );


      } catch (e) {

        alert(
          '오류 발생: ' +
          e.message
        );


        hideProgress();
      }

    };


  reader.readAsArrayBuffer(
    file
  );
}


/* =========================================================
   전체 주소 만들기
   ========================================================= */

function makeFullAddress(
  village,
  lotNumber
) {

  let address =
    '경상북도 청도군 ';


  if (village) {

    address +=
      village + ' ';
  }


  if (lotNumber) {

    address +=
      lotNumber;
  }


  return address.trim();
}


/* =========================================================
   엑셀 주소 검색
   ========================================================= */

function searchOneAddressAsync(
  address,
  managementNo,
  village,
  lotNumber
) {

  return new Promise(
    resolve => {

      geocoder.addressSearch(

        address,

        (result, status) => {


          if (
            status ===
            kakao.maps.services.Status.OK
          ) {

            const lat =
              parseFloat(
                result[0].y
              );


            const lng =
              parseFloat(
                result[0].x
              );


            if (
              !locations.some(

                item =>

                  Math.abs(
                    item.lat - lat
                  ) < 0.000001 &&

                  Math.abs(
                    item.lng - lng
                  ) < 0.000001

              )
            ) {

              addLocation(

                address,

                lat,

                lng,

                managementNo,

                /*
                 ★ 다시 한번 리만 추출
                */
                extractRiName(
                  village
                ),

                lotNumber,

                false
              );
            }


          } else {

            failedAddresses.push({

              managementNo:

                managementNo,

              address:

                address,

              lotNumber:

                lotNumber
            });
          }


          updateStatistics();


          resolve();
        }
      );
    }
  );
}


/* =========================================================
   수동 주소 검색
   ========================================================= */

function searchOneAddress(
  address,
  managementNo,
  lotNumber
) {

  geocoder.addressSearch(

    address,

    (result, status) => {


      if (
        status ===
        kakao.maps.services.Status.OK
      ) {

        const lat =
          parseFloat(
            result[0].y
          );


        const lng =
          parseFloat(
            result[0].x
          );


        /*
         ★ 주소에서 리만 찾기
        */

        const village =
          extractRiName(
            address
          );


        /*
         ★ 주소에서 지번 추출
           마지막 항목을 지번으로 사용
        */

        let detectedLot =
          lotNumber || '';


        if (!detectedLot) {

          const parts =
            address
              .trim()
              .split(/\s+/);


          if (
            parts.length > 0
          ) {

            detectedLot =
              parts[
                parts.length - 1
              ];
          }
        }


        addLocation(

          address,

          lat,

          lng,

          managementNo,

          village,

          detectedLot,

          true
        );


        map.setCenter(

          new kakao.maps.LatLng(
            lat,
            lng
          )
        );


        map.setLevel(3);


        if (
          window.innerWidth <= 700
        ) {

          toggleMenu();
        }


      } else {

        alert(
          '주소를 찾을 수 없습니다.'
        );
      }

    }
  );
}


/* =========================================================
   위치 추가
   ========================================================= */

function addLocation(
  address,
  lat,
  lng,
  managementNo,
  village,
  lotNumber,
  save = true
) {


  const location = {

    id:
      Date.now() +
      Math.random(),

    address:

      address,

    lat:

      lat,

    lng:

      lng,

    managementNo:

      managementNo || '',

    /*
     ★ 여기서도 리만 추출
    */
    village:

      extractRiName(
        village || ''
      ),

    lotNumber:

      lotNumber || '',

    status:

      0,

    marker:

      null
  };


  locations.push(
    location
  );


  createMarker(
    location
  );


  renderList();


  updateStatistics();


  if (save) {

    saveToLocalStorage();
  }
}


/* =========================================================
   ★★★ 마커 생성 ★★★
   ========================================================= */

function createMarker(
  location
) {


  /* -------------------------------------------------------
     마커 전체
     ------------------------------------------------------- */

  const container =
    document.createElement(
      'div'
    );


  container.className =
    'customMarkerCircle marker-box-' +
    location.status;


  /*
   ★ 기존 브라우저 스타일을 최대한 차단
  */

  container.style.background =
    'transparent';

  container.style.backgroundColor =
    'transparent';

  container.style.backgroundImage =
    'none';

  container.style.boxShadow =
    'none';

  container.style.textShadow =
    'none';


  container.title =

    (
      location.managementNo

        ?

        '관리번호: ' +
        location.managementNo +
        '\n'

        :

        ''
    )

    +

    location.address;


  /* =======================================================
     1줄 : 관리번호
     ======================================================= */

  const line1 =
    document.createElement(
      'div'
    );


  line1.className =
    'marker-text-line line-no';


  line1.textContent =
    location.managementNo;


  /*
   ★ 인라인으로도 흰색 제거
  */

  line1.style.background =
    'transparent';

  line1.style.color =
    'inherit';

  line1.style.textShadow =
    'none';

  line1.style.webkitTextStroke =
    '0 transparent';


  /* =======================================================
     2줄 : 리 이름
     ======================================================= */

  const line2 =
    document.createElement(
      'div'
    );


  line2.className =
    'marker-text-line line-village';


  /*
   ★ 무조건 ○○리만
  */

  line2.textContent =
    extractRiName(
      location.village
    );


  line2.style.background =
    'transparent';

  line2.style.color =
    'inherit';

  line2.style.textShadow =
    'none';

  line2.style.webkitTextStroke =
    '0 transparent';


  /* =======================================================
     3줄 : 지번
     ======================================================= */

  const line3 =
    document.createElement(
      'div'
    );


  line3.className =
    'marker-text-line line-lot';


  line3.textContent =
    location.lotNumber || '';


  line3.style.background =
    'transparent';

  line3.style.color =
    'inherit';

  line3.style.textShadow =
    'none';

  line3.style.webkitTextStroke =
    '0 transparent';


  /* =======================================================
     마커에 넣기
     ======================================================= */

  container.appendChild(
    line1
  );


  if (
    extractRiName(
      location.village
    )
  ) {

    container.appendChild(
      line2
    );
  }


  if (
    location.lotNumber
  ) {

    container.appendChild(
      line3
    );
  }


  /* =======================================================
     클릭 → 상태 변경
     ======================================================= */

  container.addEventListener(
    'click',
    () =>
      changeStatus(
        location
      )
  );


  /* =======================================================
     CustomOverlay
     ======================================================= */

  const overlay =
    new kakao.maps.CustomOverlay({

      position:

        new kakao.maps.LatLng(
          location.lat,
          location.lng
        ),

      content:

        container,

      xAnchor:

        0.5,

      yAnchor:

        0.5,

      zIndex:

        10
    });


  overlay.setMap(
    map
  );


  location.marker =
    overlay;
}


/* =========================================================
   상태 변경
   ========================================================= */

function changeStatus(
  location
) {

  location.status =

    location.status > 1

      ?

      0

      :

      location.status + 1;


  updateMarker(
    location
  );


  renderList();


  updateStatistics();


  saveToLocalStorage();
}


/* =========================================================
   마커 상태 업데이트
   ========================================================= */

function updateMarker(
  location
) {

  if (
    !location.marker
  ) {

    return;
  }


  const container =
    location.marker.getContent();


  container.className =
    'customMarkerCircle marker-box-' +
    location.status;


  /*
   ★ 상태 변경 후에도
      투명/그림자 제거 유지
  */

  container.style.background =
    'transparent';

  container.style.backgroundColor =
    'transparent';

  container.style.backgroundImage =
    'none';

  container.style.boxShadow =
    'none';

  container.style.textShadow =
    'none';
}


/* =========================================================
   상태 색상
   ========================================================= */

function getStatusColor(
  status
) {

  return status === 0

    ? '#1b365d'

    : status === 1

      ? '#28a745'

      : '#dc3545';
}


/* =========================================================
   상태 이름
   ========================================================= */

function getStatusName(
  status
) {

  return status === 0

    ? '미확인'

    : status === 1

      ? '확인완료'

      : '보류';
}


/* =========================================================
   목록 표시
   ========================================================= */

function renderList() {

  const list =
    document.getElementById(
      'list'
    );


  list.innerHTML = '';


  [...locations]
    .reverse()
    .forEach(
      location => {


        const item =
          document.createElement(
            'div'
          );


        item.className =
          'listItem';


        item.innerHTML =

          `<div
             class="listStatus"
             style="background:${getStatusColor(location.status)}">
           </div>

           <div class="listAddress">

             <span class="managementNo">
               관리번호
               ${location.managementNo || '-'}
             </span>

             <br>

             <strong>
               ${location.address}
             </strong>

             <br>

             <span class="statusText">
               ${getStatusName(location.status)}
             </span>

           </div>`;


        /* -------------------------------------------------
           삭제 버튼
           ------------------------------------------------- */

        const delBtn =
          document.createElement(
            'button'
          );


        delBtn.className =
          'deleteButton';


        delBtn.textContent =
          '✕';


        delBtn.onclick =
          (e) => {

            e.stopPropagation();

            deleteLocation(
              location
            );
          };


        item.appendChild(
          delBtn
        );


        /* -------------------------------------------------
           클릭
           ------------------------------------------------- */

        item.onclick =
          () => {

            map.setCenter(

              new kakao.maps.LatLng(

                location.lat,

                location.lng
              )
            );


            map.setLevel(3);


            if (
              window.innerWidth <= 700
            ) {

              document
                .getElementById(
                  'sidebar'
                )
                .classList
                .remove(
                  'open'
                );
            }
          };


        /* -------------------------------------------------
           더블클릭 → 상태변경
           ------------------------------------------------- */

        item.ondblclick =
          (e) => {

            e.stopPropagation();

            changeStatus(
              location
            );
          };


        list.appendChild(
          item
        );

      }
    );


  /* =======================================================
     검색 실패
     ======================================================= */

  if (
    failedAddresses.length > 0
  ) {

    const failTitle =
      document.createElement(
        'div'
      );


    failTitle.style.cssText =

      'padding:12px 7px 5px;' +

      'color:#dc3545;' +

      'font-weight:bold;' +

      'font-size:13px;';


    failTitle.textContent =

      '⚠ 검색 실패 ' +

      failedAddresses.length +

      '건';


    list.appendChild(
      failTitle
    );


    failedAddresses.forEach(
      item => {

        const fail =
          document.createElement(
            'div'
          );


        fail.style.cssText =

          'padding:7px;' +

          'margin-bottom:4px;' +

          'border:1px solid #f0c0c0;' +

          'border-radius:5px;' +

          'background:#fff7f7;' +

          'font-size:11px;';


        fail.innerHTML =

          `<b>
             ${item.managementNo || '-'}
           </b>
           <br>
           ${item.address}`;


        list.appendChild(
          fail
        );
      }
    );
  }
}


/* =========================================================
   위치 삭제
   ========================================================= */

function deleteLocation(
  location
) {

  if (
    location.marker
  ) {

    location.marker.setMap(
      null
    );
  }


  locations =
    locations.filter(
      i =>
        i.id !==
        location.id
    );


  renderList();


  updateStatistics();


  saveToLocalStorage();
}


/* =========================================================
   전체 삭제
   ========================================================= */

function clearAllLocations() {

  locations.forEach(
    l => {

      if (
        l.marker
      ) {

        l.marker.setMap(
          null
        );
      }
    }
  );


  locations = [];


  excelTotalCount = 0;


  localStorage.removeItem(
    'standard_locations_v4'
  );


  localStorage.removeItem(
    'standard_totalCount_v4'
  );


  renderList();


  updateStatistics();
}


/* =========================================================
   통계
   ========================================================= */

function updateStatistics() {

  document.getElementById(
    'totalCount'
  ).textContent =

    excelTotalCount ||
    locations.length;


  document.getElementById(
    'successCount'
  ).textContent =

    locations.length;


  document.getElementById(
    'failCount'
  ).textContent =

    failedAddresses.length;


  document.getElementById(
    'doneCount'
  ).textContent =

    locations.filter(
      i =>
        i.status === 1
    ).length;
}


/* =========================================================
   진행률
   ========================================================= */

function showProgress() {

  document.getElementById(
    'progressArea'
  ).style.display =
    'block';


  document.getElementById(
    'progressBar'
  ).style.width =
    '0%';
}


/* =========================================================
   진행률 업데이트
   ========================================================= */

function updateProgress(
  curr,
  tot,
  addr
) {

  const pct =

    tot > 0

      ?

      Math.round(
        curr / tot * 100
      )

      :

      0;


  document.getElementById(
    'progressBar'
  ).style.width =
    pct + '%';


  document.getElementById(
    'progressText'
  ).textContent =

    `${curr} / ${tot}건 처리 중... ${pct}%`;
}


/* =========================================================
   진행률 숨기기
   ========================================================= */

function hideProgress() {

  document.getElementById(
    'progressArea'
  ).style.display =
    'none';
}


/* =========================================================
   대기
   ========================================================= */

function sleep(ms) {

  return new Promise(
    r =>
      setTimeout(
        r,
        ms
      )
  );
}


/* =========================================================
   모든 마커 표시
   ========================================================= */

function fitAllMarkers() {

  if (
    !locations.length
  ) {

    return;
  }


  const bounds =
    new kakao.maps.LatLngBounds();


  locations.forEach(
    l => {

      bounds.extend(

        new kakao.maps.LatLng(
          l.lat,
          l.lng
        )
      );
    }
  );


  map.setBounds(
    bounds
  );


  if (
    locations.length === 1
  ) {

    map.setLevel(4);
  }
}


/* =========================================================
   화면 크기 변경
   ========================================================= */

window.addEventListener(
  'resize',
  () =>
    map.relayout()
);


/* =========================================================
   시작
   ========================================================= */

loadFromLocalStorage();

updateStatistics();

</script>
